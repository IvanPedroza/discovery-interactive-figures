    const palette = ["#0f6b48", "#2a9d8f", "#e9c46a", "#f4a261", "#e76f51", "#4866a3", "#8a5fbf", "#b85c7a", "#607d3b", "#444444"];
    const metricSelect = document.getElementById("metric-select");
    const genusSelect = document.getElementById("genus-select");
    const groupSelect = document.getElementById("group-select");
    const scaleSelect = document.getElementById("scale-select");

    function fillSelect(select, rows, getValue, getLabel) {
      select.innerHTML = "";
      for (const row of rows) {
        const option = document.createElement("option");
        option.value = getValue(row);
        option.textContent = getLabel(row);
        select.appendChild(option);
      }
    }

    fillSelect(metricSelect, DATA.metrics, row => row.key, row => row.label);
    fillSelect(genusSelect, [{ genus: "__all__" }].concat(DATA.genera.map(genus => ({ genus }))), row => row.genus, row => row.genus === "__all__" ? "All top genera" : row.genus);

    function metricLabel(metric) {
      return (DATA.metrics.find(row => row.key === metric) || { label: metric }).label;
    }

    function rowsForTrend() {
      const genus = genusSelect.value;
      const group = groupSelect.value;
      const metric = metricSelect.value;
      let rows = group === "source" ? DATA.weekly_source : group === "city" ? DATA.weekly_city : DATA.weekly;
      if (genus !== "__all__") rows = rows.filter(row => row.genus === genus);
      return { rows, metric, group, genus };
    }

    function makeTrace(rows, name, metric, colorIndex) {
      return {
        x: rows.map(row => row.week),
        y: rows.map(row => row[metric]),
        mode: "lines+markers",
        type: "scatter",
        name,
        line: { width: 2, color: palette[colorIndex % palette.length] },
        marker: { size: 5 },
        hovertemplate: "%{x}<br>%{y:,.2f}<extra>" + name + "</extra>"
      };
    }

    function monsoonShapes() {
      return DATA.monsoon_intervals.map(interval => ({
        type: "rect",
        xref: "x",
        yref: "paper",
        x0: interval.start,
        x1: interval.end,
        y0: 0,
        y1: 1,
        fillcolor: "rgba(42, 157, 143, 0.14)",
        line: { width: 0 },
        layer: "below"
      }));
    }

    function monsoonAnnotations() {
      return DATA.monsoon_intervals.map(interval => ({
        x: interval.start,
        y: 1.02,
        xref: "x",
        yref: "paper",
        text: "Monsoon",
        showarrow: false,
        xanchor: "left",
        font: { size: 11, color: "#2f6f87" }
      }));
    }

    function renderTrend() {
      const { rows, metric, group, genus } = rowsForTrend();
      const traces = [];
      if (group === "overall") {
        const groups = genus === "__all__" ? DATA.genera : [genus];
        groups.forEach((g, index) => traces.push(makeTrace(rows.filter(row => row.genus === g), g, metric, index)));
      } else if (group === "source") {
        const groups = DATA.sources;
        groups.forEach((source, index) => traces.push(makeTrace(rows.filter(row => row.source_group === source), source, metric, index)));
      } else {
        const groups = DATA.cities;
        groups.forEach((city, index) => traces.push(makeTrace(rows.filter(row => row.geographic_location_city === city), city, metric, index)));
      }
      Plotly.react("trend-chart", traces, {
        autosize: true,
        title: { text: `${genus === "__all__" ? "Top ten genera" : genus} over time`, x: 0 },
        xaxis: { title: "Collection week" },
        yaxis: { title: metricLabel(metric), type: scaleSelect.value },
        shapes: monsoonShapes(),
        annotations: monsoonAnnotations(),
        legend: { orientation: "h", y: -0.22 },
        margin: { l: 70, r: 20, t: 50, b: 90 },
        hovermode: "x unified"
      }, {
        responsive: true,
        toImageButtonOptions: { format: "png", filename: "wastewater-trends-1000px", width: 1000, height: 520, scale: 1 }
      });
    }

    function renderComposition() {
      const metric = metricSelect.value;
      const totals = DATA.totals.slice().sort((a, b) => b[metric] - a[metric]);
      Plotly.react("composition-chart", [{
        x: totals.map(row => row.genus),
        y: totals.map(row => row[metric]),
        type: "bar",
        marker: { color: totals.map((_, i) => palette[i % palette.length]) },
        hovertemplate: "%{x}<br>%{y:,.2f}<extra></extra>"
      }], {
        title: { text: "Total signal across selected genera", x: 0 },
        autosize: true,
        xaxis: { title: "Genus", tickangle: -35 },
        yaxis: { title: metricLabel(metric), type: scaleSelect.value },
        margin: { l: 70, r: 20, t: 50, b: 140 }
      }, {
        responsive: true,
        toImageButtonOptions: { format: "png", filename: "wastewater-totals-1000px", width: 1000, height: 420, scale: 1 }
      });
    }

    function renderAll() { renderTrend(); renderComposition(); }
    [metricSelect, genusSelect, groupSelect, scaleSelect].forEach(el => el.addEventListener("change", renderAll));
    document.getElementById("download-data").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(rowsForTrend(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "visible-virus-trend-data.json";
      a.click();
      URL.revokeObjectURL(url);
    });
    renderAll();
  </script>
</body>
</html>
